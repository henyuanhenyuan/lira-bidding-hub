x-lira-env: &lira-env
  LIRA_DATA_DIR: /data
  LIRA_DATABASE_URL: postgresql://lira:lira@db:5432/lira
  LIRA_REDIS_URL: redis://redis:6379/0
  # 本地开发用 Ollama；生产建议改走 OpenAI 兼容通道（qwen-plus / DeepSeek）
  LIRA_OLLAMA_URL: http://host.docker.internal:11434
  LIRA_OLLAMA_MODEL: qwen3:4b
  LIRA_LLM_ROUTE: auto
  # LIRA_OPENAI_BASE_URL: https://dashscope.aliyuncs.com/compatible-mode/v1
  # LIRA_OPENAI_API_KEY: sk-xxx
  # LIRA_OPENAI_MODEL: qwen-plus
  LIRA_AUTH: "off"
  LIRA_SCHEDULER: "celery"
  LIRA_DIGEST_AT: "09:00"
  LIRA_TZ: "Asia/Shanghai"
  # LIRA_INGEST_TOKEN: change-me
  # LIRA_WEBHOOK: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxx

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lira
      POSTGRES_PASSWORD: lira
      POSTGRES_DB: lira
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lira -d lira"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  lira:
    build: .
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8011:8011"
    environment: *lira-env
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  worker:
    build: .
    command:
      - celery
      - -A
      - app.celery_app
      - worker
      - --loglevel=info
      - -B
      - --schedule=/data/celerybeat-schedule
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: *lira-env
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  pgdata:
