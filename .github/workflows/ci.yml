name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: 语法与未定义名检查
        run: pip install ruff && ruff check --select E9,F63,F7,F82 app tests
      - name: 单元测试
        run: pytest -q
      - name: 评测门禁（冒烟）
        run: python scripts/eval_gate.py --tier smoke --no-artifact
        continue-on-error: true

  eval-nightly:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -U pip
          pip install -r requirements.txt
      - name: 全量评测
        run: python scripts/eval_gate.py --tier full
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: data/eval/results/
