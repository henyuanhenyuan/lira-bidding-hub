<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · 竞品情报</title>
<link rel="stylesheet" href="/static/styles.css?v=20261025b">
<style>
  .login-page {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background:
      radial-gradient(1100px 560px at 18% -10%, #e9ecff 0%, transparent 55%),
      radial-gradient(900px 520px at 100% 110%, #eef6f4 0%, transparent 50%),
      var(--bg);
  }
  .login-card {
    width: 360px; display: flex; flex-direction: column; gap: 14px;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 28px; box-shadow: var(--shadow-2);
  }
  .login-head { display: flex; align-items: center; gap: 11px; margin-bottom: 2px; }
  .login-head strong { display: block; font-size: 15px; }
  .login-head span { font-size: 11.5px; color: var(--muted); }
  .login-card label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 12px; color: var(--muted);
  }
  .login-card input {
    padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: var(--r-sm);
    font: inherit; color: var(--text); background: var(--surface-2);
  }
  .login-card input:focus { outline: 2px solid var(--accent-line); border-color: var(--accent); }
  .login-card .btn { justify-content: center; margin-top: 4px; }
  .login-foot { font-size: 11.5px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main class="login-page">
  <form class="login-card" id="login-form" novalidate>
    <div class="login-head">
      <div class="brand-mark">竞</div>
      <div>
        <strong>竞品情报 Agent</strong>
        <span>内网版 · 数据不出域</span>
      </div>
    </div>

    <label for="username">用户名
      <input id="username" name="username" autocomplete="username" required autofocus>
    </label>
    <label for="password">密码
      <input id="password" name="password" type="password" autocomplete="current-password" required>
    </label>

    <button class="btn" type="submit" id="submit">登录</button>
    <div class="login-foot" id="msg" role="status" aria-live="polite"></div>
  </form>
</main>

<script>
const form = document.getElementById('login-form');
const msg = document.getElementById('msg');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  if (!username || !password) { msg.textContent = '请输入用户名和密码'; return; }

  submit.disabled = true;
  msg.textContent = '';
  try {
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password }),
    });
    if (res.status === 429) throw new Error('尝试过于频繁，请稍后再试');
    if (!res.ok) throw new Error('用户名或密码错误');
    location.replace('/');
  } catch (err) {
    msg.textContent = err.message || '登录失败';
    submit.disabled = false;
  }
});
</script>
</body>
</html>
